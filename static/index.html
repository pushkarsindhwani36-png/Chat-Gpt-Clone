<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My AI Agent</title>
<style>
  :root {
    --bg: #343541;
    --sidebar: #202123;
    --panel: #444654;
    --text: #ececf1;
    --accent: #10a37f;
    --border: #565869;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 240px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
  }
  #sidebar button.new-chat {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: left;
  }
  .session-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .session-item:hover { background: #2a2b32; }
  .session-item.active { background: var(--panel); }
  .session-item .delete-btn {
    opacity: 0;
    background: transparent;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .session-item:hover .delete-btn { opacity: 1; }
  .session-item .delete-btn:hover { background: #555; color: white; }
  #main { flex: 1; display: flex; flex-direction: column; }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 0; }
  .msg {
    max-width: 700px;
    margin: 0 auto;
    padding: 16px 20px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .msg.assistant { background: var(--panel); }
  .msg .role { font-weight: 600; font-size: 12px; opacity: 0.6; margin-bottom: 4px; }
  .msg img { max-width: 400px; border-radius: 8px; display: block; margin-top: 6px; }
  #input-bar { padding: 16px; border-top: 1px solid var(--border); display: flex; justify-content: center; }
  #input-inner { width: 100%; max-width: 700px; display: flex; gap: 8px; }
  #input-inner textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  #input-inner button.send-btn {
    background: var(--accent); border: none; color: white; padding: 0 18px;
    border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  #input-inner button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #hint { max-width: 700px; margin: 0 auto 6px auto; font-size: 12px; opacity: 0.5; }
</style>
</head>
<body>
  <div id="sidebar">
    <button class="new-chat" id="new-chat">+ New chat</button>
    <div id="session-list"></div>
  </div>
  <div id="main">
    <header><h1>My AI Agent</h1></header>
    <div id="chat"></div>
    <div id="input-bar" style="flex-direction: column;">
      <div id="hint">Tip: type <code>/image a description</code> to generate a picture</div>
      <div id="input-inner">
          <input type="file" id="photo-input" accept="image/*" style="display:none;" />
   <button class="send-btn" id="attach-btn" style="background: transparent; border: 1px solid var(--border);">📎</button>
   <textarea id="input" rows="1" placeholder="Message the agent... (or /image a cat wearing sunglasses)"></textarea>
   <button class="send-btn" id="send">Send</button>
      </div>
    </div>
  </div>

<script>
let sessionId = null;
   let pendingImageBase64 = null;
   const photoInput = document.getElementById("photo-input");
   const attachBtn = document.getElementById("attach-btn");

   attachBtn.addEventListener("click", () => photoInput.click());

   photoInput.addEventListener("change", () => {
     const file = photoInput.files[0];
     if (!file) return;
     const reader = new FileReader();
     reader.onload = () => {
       pendingImageBase64 = reader.result; // data:image/...;base64,....
       attachBtn.textContent = "✅";
     };
     reader.readAsDataURL(file);
   });

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newChatBtn = document.getElementById("new-chat");
const sessionListEl = document.getElementById("session-list");

async function refreshSessionList() {
  const res = await fetch("/sessions");
  const sessions = await res.json();
  sessionListEl.innerHTML = "";
  sessions.reverse().forEach(s => {
    const div = document.createElement("div");
    div.className = "session-item" + (s.session_id === sessionId ? " active" : "");

    const label = document.createElement("span");
    label.textContent = s.preview || "New chat";
    label.style.overflow = "hidden";
    label.style.textOverflow = "ellipsis";
    label.onclick = () => loadSession(s.session_id);

    const delBtn = document.createElement("button");
    delBtn.className = "delete-btn";
    delBtn.textContent = "×";
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      await fetch(`/session/${s.session_id}`, { method: "DELETE" });
      if (s.session_id === sessionId) {
        startSession();
      } else {
        refreshSessionList();
      }
    };

    div.appendChild(label);
    div.appendChild(delBtn);
    sessionListEl.appendChild(div);
  });
}

async function loadSession(id) {
  sessionId = id;
  chatEl.innerHTML = "";
  const res = await fetch(`/history/${id}`);
  const messages = await res.json();
  messages.forEach(m => addMessage(m.role, m.content));
  refreshSessionList();
}

async function startSession() {
  const res = await fetch("/session", { method: "POST" });
  const data = await res.json();
  sessionId = data.session_id;
  chatEl.innerHTML = "";
  refreshSessionList();
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="role">${role === "user" ? "You" : "Assistant"}</div><div class="content"></div>`;
  div.querySelector(".content").textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div.querySelector(".content");
}

function addImage(url) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="role">Assistant</div>`;
  const img = document.createElement("img");
  img.src = url;
  div.appendChild(img);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !sessionId) return;
  inputEl.value = "";
  sendBtn.disabled = true;

  addMessage("user", text);

  if (text.toLowerCase().startsWith("/image ")) {
    const prompt = text.slice(7).trim();
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
    addImage(url);
    sendBtn.disabled = false;
    return;
  }

  const assistantContentEl = addMessage("assistant", "");

     const res = await fetch("/chat", {
     method: "POST",
     headers: { "Content-Type": "application/json" },
     body: JSON.stringify({
       session_id: sessionId,
       message: text,
       image: pendingImageBase64,
     }),
   });
   pendingImageBase64 = null;
   attachBtn.textContent = "📎";
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      if (part.startsWith("data: ")) {
        const chunk = part.slice(6);
        if (chunk === "[DONE]") continue;
        assistantContentEl.textContent += chunk;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
  }

  sendBtn.disabled = false;
  refreshSessionList();
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
newChatBtn.addEventListener("click", startSession);

startSession();
</script>
</body>
</html>
