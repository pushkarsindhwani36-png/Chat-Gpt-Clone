<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My AI Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
  :root {
    --bg: #343541;
    --sidebar: #202123;
    --panel: #444654;
    --text: #ececf1;
    --accent: #10a37f;
    --border: #565869;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  /* ---- Auth screen ---- */
  #auth-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  #auth-box {
    width: 320px;
    background: var(--panel);
    padding: 30px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #auth-box h2 { margin: 0 0 10px 0; text-align: center; }
  #auth-box input {
    background: var(--sidebar);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  #auth-box button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  #auth-toggle { text-align: center; font-size: 13px; opacity: 0.8; cursor: pointer; text-decoration: underline; }
  #auth-error { color: #ff6b6b; font-size: 13px; text-align: center; min-height: 16px; }

  /* ---- App layout ---- */
  #app { display: none; width: 100%; height: 100%; flex-direction: row; }
  #sidebar {
    width: 240px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
  }
  #sidebar button.new-chat {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: left;
  }
  #logout-btn {
    margin-top: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .session-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .session-item:hover { background: #2a2b32; }
  .session-item.active { background: var(--panel); }
  .session-item .delete-btn {
    opacity: 0;
    background: transparent;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .session-item:hover .delete-btn { opacity: 1; }
  .session-item .delete-btn:hover { background: #555; color: white; }
  #main { flex: 1; display: flex; flex-direction: column; }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 0; }
  .msg {
    max-width: 700px;
    margin: 0 auto;
    padding: 16px 20px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .msg.assistant { background: var(--panel); }
  .msg .role { font-weight: 600; font-size: 12px; opacity: 0.6; margin-bottom: 4px; }
  .msg .content pre {
    background: #1e1e1e;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg .content code {
    background: #1e1e1e;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "Consolas", "Monaco", monospace;
  }
  .msg .content pre code { background: none; padding: 0; }
  .msg .content ul, .msg .content ol { margin: 8px 0; padding-left: 24px; }
  .msg .content p { margin: 8px 0; }
  .msg .content p:first-child { margin-top: 0; }
  .msg .content p:last-child { margin-bottom: 0; }
  .msg img { max-width: 400px; border-radius: 8px; display: block; margin-top: 6px; }
  #input-bar { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
  #main.empty-chat {
    justify-content: center;
  }
  #main.empty-chat #chat {
    display: none;
  }
  #main.empty-chat #input-bar {
    border-top: none;
  }
  #main.empty-chat #welcome-title {
    display: block;
  }
  #welcome-title {
    display: none;
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 20px;
    opacity: 0.9;
  }
  #hint { max-width: 700px; margin: 0 auto 6px auto; font-size: 12px; opacity: 0.5; }
  #input-inner { width: 100%; max-width: 700px; display: flex; gap: 8px; }
  #input-inner textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  #input-inner button.send-btn {
    background: var(--accent); border: none; color: white; padding: 0 18px;
    border-radius: 8px; cursor: pointer; font-weight: 600;
  }
  #input-inner button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <!-- Login / Signup screen -->
  <div id="auth-screen">
    <div id="auth-box">
      <h2 id="auth-title">Log in</h2>
      <input type="text" id="auth-username" placeholder="Username" />
      <input type="password" id="auth-password" placeholder="Password" />
      <div id="auth-error"></div>
      <button id="auth-submit">Log in</button>
      <div id="auth-toggle">Don't have an account? Sign up</div>
    </div>
  </div>

  <!-- Main app (hidden until logged in) -->
  <div id="app">
    <div id="sidebar">
      <button class="new-chat" id="new-chat">+ New chat</button>
      <div id="session-list"></div>
      <button id="logout-btn">Log out</button>
    </div>
    <div id="main">
      <header>
        <h1>My AI Agent</h1>
        <span id="welcome-user" style="font-size:12px;opacity:0.7;"></span>
      </header>
      <div id="chat"></div>
      <div id="welcome-title">What can I help with?</div>
      <div id="input-bar">
        <div id="hint">Tip: type <code>/image a description</code> to generate a picture</div>
        <div id="input-inner">
          <input type="file" id="photo-input" accept="image/*" style="display:none;" />
          <button class="send-btn" id="attach-btn" style="background: transparent; border: 1px solid var(--border);">📎</button>
          <textarea id="input" rows="1" placeholder="Message the agent..."></textarea>
          <button class="send-btn" id="send">Send</button>
        </div>
      </div>
    </div>
  </div>

<script>
let sessionId = null;
let authToken = localStorage.getItem("authToken");
let isSignupMode = false;

const authScreen = document.getElementById("auth-screen");
const appEl = document.getElementById("app");
const authTitle = document.getElementById("auth-title");
const authUsername = document.getElementById("auth-username");
const authPassword = document.getElementById("auth-password");
const authError = document.getElementById("auth-error");
const authSubmit = document.getElementById("auth-submit");
const authToggle = document.getElementById("auth-toggle");
const welcomeUser = document.getElementById("welcome-user");

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newChatBtn = document.getElementById("new-chat");
const sessionListEl = document.getElementById("session-list");
const logoutBtn = document.getElementById("logout-btn");

let pendingImageBase64 = null;
const photoInput = document.getElementById("photo-input");
const attachBtn = document.getElementById("attach-btn");

attachBtn.addEventListener("click", () => photoInput.click());
photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImageBase64 = reader.result;
    attachBtn.textContent = "✅";
  };
  reader.readAsDataURL(file);
});

authToggle.addEventListener("click", () => {
  isSignupMode = !isSignupMode;
  authTitle.textContent = isSignupMode ? "Sign up" : "Log in";
  authSubmit.textContent = isSignupMode ? "Sign up" : "Log in";
  authToggle.textContent = isSignupMode ? "Already have an account? Log in" : "Don't have an account? Sign up";
  authError.textContent = "";
});

authSubmit.addEventListener("click", async () => {
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) {
    authError.textContent = "Please fill in both fields.";
    return;
  }
  const endpoint = isSignupMode ? "/signup" : "/login";
  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      authError.textContent = data.detail || "Something went wrong.";
      return;
    }
    authToken = data.token;
    localStorage.setItem("authToken", authToken);
    localStorage.setItem("username", data.username);
    showApp();
  } catch (e) {
    authError.textContent = "Network error. Try again.";
  }
});

function authHeaders(extra = {}) {
  return { ...extra, "Authorization": `Bearer ${authToken}` };
}

async function showApp() {
  authScreen.style.display = "none";
  appEl.style.display = "flex";
  welcomeUser.textContent = localStorage.getItem("username") || "";
  await startSession();
}

logoutBtn.addEventListener("click", () => {
  localStorage.removeItem("authToken");
  localStorage.removeItem("username");
  authToken = null;
  appEl.style.display = "none";
  authScreen.style.display = "flex";
  authUsername.value = "";
  authPassword.value = "";
});

async function refreshSessionList() {
  const res = await fetch("/sessions", { headers: authHeaders() });
  if (!res.ok) return;
  const sessions = await res.json();
  sessionListEl.innerHTML = "";
  sessions.reverse().forEach(s => {
    const div = document.createElement("div");
    div.className = "session-item" + (s.session_id === sessionId ? " active" : "");

    const label = document.createElement("span");
    label.textContent = s.preview || "New chat";
    label.style.overflow = "hidden";
    label.style.textOverflow = "ellipsis";
    label.onclick = () => loadSession(s.session_id);

    const delBtn = document.createElement("button");
    delBtn.className = "delete-btn";
    delBtn.textContent = "×";
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      await fetch(`/session/${s.session_id}`, { method: "DELETE", headers: authHeaders() });
      if (s.session_id === sessionId) {
        startSession();
      } else {
        refreshSessionList();
      }
    };

    div.appendChild(label);
    div.appendChild(delBtn);
    sessionListEl.appendChild(div);
  });
}

async function loadSession(id) {
  sessionId = id;
  chatEl.innerHTML = "";
  const res = await fetch(`/history/${id}`, { headers: authHeaders() });
  const messages = await res.json();
  const mainEl = document.getElementById("main");
  if (messages.length === 0) {
    mainEl.classList.add("empty-chat");
  } else {
    mainEl.classList.remove("empty-chat");
  }
  messages.forEach(m => addMessage(m.role, m.content));
  refreshSessionList();
}

async function startSession() {
  const res = await fetch("/session", { method: "POST", headers: authHeaders() });
  const data = await res.json();
  sessionId = data.session_id;
  chatEl.innerHTML = "";
  document.getElementById("main").classList.add("empty-chat");
  refreshSessionList();
}

function renderMarkdown(el, rawText) {
  if (el.dataset.role === "user") {
    el.textContent = rawText; // user messages stay as plain text
  } else {
    el.innerHTML = DOMPurify.sanitize(marked.parse(rawText));
  }
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="role">${role === "user" ? "You" : "Assistant"}</div><div class="content"></div>`;
  const contentEl = div.querySelector(".content");
  contentEl.dataset.role = role;
  contentEl.dataset.raw = text;
  renderMarkdown(contentEl, text);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return contentEl;
}

function addImage(url) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="role">Assistant</div>`;
  const img = document.createElement("img");
  img.src = url;
  div.appendChild(img);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !sessionId) return;
  inputEl.value = "";
  sendBtn.disabled = true;

  document.getElementById("main").classList.remove("empty-chat");
  addMessage("user", text);

  if (text.toLowerCase().startsWith("/image ")) {
    const prompt = text.slice(7).trim();
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
    addImage(url);
    sendBtn.disabled = false;
    return;
  }

  const assistantContentEl = addMessage("assistant", "");

  const res = await fetch("/chat", {
    method: "POST",
    headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ session_id: sessionId, message: text, image: pendingImageBase64 }),
  });
  pendingImageBase64 = null;
  attachBtn.textContent = "📎";

  if (!res.ok) {
    assistantContentEl.textContent = "Something went wrong.";
    sendBtn.disabled = false;
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      if (part.startsWith("data: ")) {
        const chunk = part.slice(6);
        if (chunk === "[DONE]") continue;
        assistantContentEl.dataset.raw = (assistantContentEl.dataset.raw || "") + chunk;
        renderMarkdown(assistantContentEl, assistantContentEl.dataset.raw);
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
  }

  sendBtn.disabled = false;
  refreshSessionList();
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
newChatBtn.addEventListener("click", startSession);

// On page load: if we already have a token, skip straight to the app
if (authToken) {
  showApp();
} else {
  authScreen.style.display = "flex";
}
</script>
</body>
</html>
